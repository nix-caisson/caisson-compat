name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check -L
      - run: nix eval '.#lib.caisson-compat.tests.summary'
      # The scheduled run is the family's drift detector: advance every
      # pin, rerun the suite, and land the advance when green.
      - if: github.event_name == 'schedule'
        run: |
          nix flake update
          nix eval '.#lib.caisson-compat.tests.summary'
          if ! git diff --quiet flake.lock; then
            git config user.name "caisson-compat cron"
            git config user.email "noreply@github.com"
            git add flake.lock
            git commit -m "maint: advance pins (scheduled drift detection)"
            git push
          fi
