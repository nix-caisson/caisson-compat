name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      - run: nix flake check -L
      - run: nix eval '.#lib.caisson-compat.tests.summary'
      # The drift detector: advance every pin, rerun the suite, and
      # land the advance when green. Runs on the weekly schedule and
      # on a manual dispatch, so the advance can be pulled forward
      # when the family lands a change worth testing against now.
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          nix flake update
          nix eval '.#lib.caisson-compat.tests.summary'
          if ! git diff --quiet flake.lock; then
            git config user.name "caisson-compat drift detector"
            git config user.email "noreply@github.com"
            git add flake.lock
            git commit -m "maint: advance pins (${{ github.event_name }} drift detection)"
            git push
          fi
